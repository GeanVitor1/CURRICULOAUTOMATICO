<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conectar conta · EmpreGatos</title>
<link rel="stylesheet" href="popup.css">
<main class="card">
 <header>
  <span class="brand">EmpreGatos</span>
  <h1 id="title">Conectar conta</h1>
  <p id="account" class="account" aria-live="polite">Verificando sua conta no EmpreGatos…</p>
 </header>
 <ol class="steps" aria-label="Como funciona">
  <li id="step-login"><b>1</b><span>Entre no portal na aba que vamos abrir</span></li>
  <li id="step-detect"><b>2</b><span>Reconhecemos o login automaticamente</span></li>
  <li id="step-done"><b>3</b><span>Você volta para o EmpreGatos conectado</span></li>
 </ol>
 <button id="connect" class="primary" disabled>Conectar conta</button>
 <p id="consent-label" class="consent"></p>
 <p id="status" role="status" aria-live="polite"></p>
 <label class="switch"><span>Portal</span>
  <select id="portal"><option value="gupy">Gupy</option><option value="infojobs">InfoJobs</option><option value="glassdoor">Glassdoor</option><option value="linkedin">LinkedIn</option></select>
 </label>
 <p id="version" class="note"></p>
</main>
<script src="config.js"></script><script src="popup.js"></script></html>
