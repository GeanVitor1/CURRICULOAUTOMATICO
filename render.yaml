# Backend da EmpreGatos no Render (plano gratuito).
# Front continua no GitHub Pages; ele chama esta API via VITE_API_URL.
services:
  - type: web
    name: empregatos-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "false"
      - key: TRUST_PROXY
        value: "true"
      - key: CROSS_SITE_COOKIES
        value: "true"
      - key: APP_ORIGIN
        value: https://geanvitor1.github.io
      - key: DATABASE_PROVIDER
        value: firestore
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
